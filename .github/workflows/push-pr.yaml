on : 
    push :
        branches :
          - main
          - "release/**"
        paths :
          - "src/**"
        pull_request :
          - main
          - "release/**"
jobs : 
    tests :
        runs-on : ububtu-latest
        steps :
            - name : checkout-code
              uses : actions/checkout@v4.2.2

            - name : run-tests
              uses : npm test
